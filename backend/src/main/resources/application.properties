# ============================
# Environment / Secret Import
# ============================
# Spring Boot 2.4+ will safely load variables from a local .env file
spring.config.import=optional:file:.env[.properties]

# ============================
# Server Configuration
# ============================
server.port=8080

# ============================
# MySQL Database Configuration
# ============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tracify_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================
# JWT Configuration
# ============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration-ms=604800000

# ============================
# File Upload Configuration
# ============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# ============================
# CORS Configuration
# ============================
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# ============================
# Swagger/OpenAPI
# ============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================
# Logging
# ============================
logging.level.com.tracify=DEBUG
logging.level.org.springframework.security=WARN
